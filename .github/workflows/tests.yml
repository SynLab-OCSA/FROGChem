name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    # macOS hosted runners are often not assigned to this repository ("The job was not acquired by
    # Runner of type hosted"): those jobs were cancelled after 15 min and failed every run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install FROG and dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch (needed by aimnet): the default CUDA wheels filled the runner disk
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install pytest

      - name: Run pytest
        run: |
          pytest -v
