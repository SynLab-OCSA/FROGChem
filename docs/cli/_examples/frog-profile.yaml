intro: |
  The model reaction of the [Reaction Profiles user guide](../user-guide/reaction_profiles.md): a main path
  R → TS1 → INT → TS2 → P and a second path that branches from INT. The YAML input is written in a hidden
  first step; its content is shown below.
steps:
  - hidden: true
    cmd: |
      cat > pes.yaml <<'YAML'
      title: "Model reaction"
      units: "kcal/mol"
      steps: [R, TS1, INT, TS2, P]
      label_points: [TS1, TS2]
      pathways:
        - name: "Path A"
          energies: [0.0, 18.4, -3.2, 12.1, -10.5]
        - name: "Path B"
          style: dashed
          branch_at: INT
          energies: [-3.2, 15.8, -12.0]
      YAML
  - text: |
      **1. YAML input, default style.** The figure is written next to the input as `pes_profile.png`.
    cmd: frog-profile pes.yaml --dpi 150
    show_files:
      - path: pes.yaml
        lang: yaml
    images:
      - path: pes_profile.png
        caption: Default style, hollow markers, energies printed at TS1 and TS2.
        width: 80%
    after: |
      * Each pathway is a smooth curve through its states; `Path B` starts at `INT` (`branch_at: INT`) and is
        drawn dashed (`style: dashed`).
      * Only the states listed in `label_points` carry a number: 18.4 at TS1, 12.1 (Path A) and 15.8 (Path B)
        at TS2, i.e. the input values with one decimal. No y-axis frame is drawn by default.
  - text: |
      **2. Same input, different look**: presentation preset, bar markers and the barriers in the legend.
      `-o` chooses the file name.
    cmd: frog-profile pes.yaml --style presentation --point-type bar --legend-barriers -o pes_bar.png --dpi 150
    images:
      - path: pes_bar.png
        caption: Presentation preset with bar markers and the highest intermediate energy of each path in the legend.
        width: 80%
    after: |
      * `--legend-barriers` appends to each legend entry the highest energy between the first and the last
        point of that pathway: 18.4 for Path A and 15.8 for Path B. It is the value as given in the input
        (relative to the common zero), not the barrier measured from the preceding minimum: for Path B the
        step INT → TS2 is 15.8 − (−3.2) kcal/mol.
      * `--point-type bar` replaces the hollow dots with horizontal bars, and the curves join the bar ends.
